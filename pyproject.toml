[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermae-v2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "astropy==8.0.3",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "photutils==3.0.0",
    "scikit-image==0.26.0",
    "scipy==1.18.1",
]

[project.scripts]
hermae = "hermae.__main__:main"

[tool.setuptools.packages.find]
include = ["hermae*"]
